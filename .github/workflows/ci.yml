name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test -timeout 60s ./...
      - run: go build ./...
      - name: Baseline statistics tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts/baseline -p 'test_*.py'
      - name: Kubernetes deployment boundary guards
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s deploy/kubernetes -p 'test_*.py'
      - name: Profile statistics tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_profile_summary.py'
      - name: Balanced local target evaluator and recorded evidence
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest discover -s scripts -p 'test_performance_targets.py'
          python3 scripts/check-performance-targets.py --baseline-summary docs/baselines/f08-2026-10-07/summary.json --profile-summary docs/validation/f10-registration-summary.json
      - name: Documentation links and fences
        if: runner.os == 'Linux'
        run: python3 scripts/check-docs.py
      - name: PowerShell scripts and documented examples
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-powershell.ps1
      - name: Race detection
        if: runner.os == 'Linux'
        run: go test -race -timeout 60s ./...
      - name: Process signal smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go build -o /tmp/forge-api ./cmd/api
          if FORGE_HTTP_ADDR=0.0.0.0:8081 /tmp/forge-api; then
            echo 'Unsafe configuration was accepted'
            exit 1
          fi
          /tmp/forge-api > /tmp/forge-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8081/readyz
          kill -TERM "$pid"
          wait "$pid"
          grep -q 'API stopped' /tmp/forge-api.log
          trap - EXIT

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d3852670a11f0cb9cb1cd50916dc02a0021143fb22d96b78eeef26348abe55c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forge-ci-test-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORGE_TEST_ADMIN_DATABASE_URL: postgres://postgres:forge-ci-test-only@127.0.0.1:5432/postgres?sslmode=disable
      FORGE_REQUIRE_DB_TESTS: '1'
      FORGE_RESTART_PROOF_FILE: /tmp/forge-restart-proof.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -timeout 120s ./...
      - name: F10 opt-in profile smoke and raw summary
        env:
          FORGE_PROFILE_OUTPUT: /tmp/forge-f10-profiles
          FORGE_PROFILE_SMOKE: '1'
        run: |
          go test -count=1 -timeout 60s -run '^TestRegistrationLoadProfile$' ./internal/service
          python3 scripts/profile-summary.py /tmp/forge-f10-profiles > /tmp/forge-f10-summary.json
          python3 -c 'import json; s=json.load(open("/tmp/forge-f10-summary.json")); assert len(s["levels"]) == 2; assert all(x["smoke"] and x["failed_requests"] == 0 and x["failed_journeys"] == 0 and x["all_phase_failed_requests"] == 0 and x["all_phase_failed_journeys"] == 0 for x in s["levels"])'
      - name: Seed restart proof
        env:
          FORGE_TEST_RESTART_PHASE: seed
        run: go test -count=1 -v -run '^TestPostgreSQLRestartPersistence$' ./internal/store
      - name: Restart PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify after database restart
        env:
          FORGE_TEST_RESTART_PHASE: verify
        run: go test -count=1 -v -run '^TestPostgreSQLRestartPersistence$' ./internal/store

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native prerequisites
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main\n' | sudo tee /etc/apt/sources.list.d/forge-pgdg.list > /dev/null
          sudo apt-get update -qq
          pg_version=$(apt-cache madison postgresql-18 | awk '$3 ~ /^18[.]6-/ {print $3; exit}')
          test -n "$pg_version"
          sudo apt-get install -y --no-install-recommends openjdk-21-jre-headless "postgresql-18=$pg_version" python3
      - name: Native lifecycle guard tests
        run: python3 -m unittest discover -s deploy/native -p 'test_*.py'
      - name: Cold start and real authorization-code smoke
        shell: bash
        run: |
          sudo python3 deploy/native/stack.py up --user "$USER" --go "$(command -v go)"
          python3 deploy/native/smoke.py seed
      - name: Quickstart examples from clean checkout with real token
        shell: pwsh
        run: ./scripts/api-examples.ps1 -TokenFile "$HOME/.local/share/forge-native/tokens/ahmad.json"
      - name: Stop retains data
        shell: bash
        run: |
          sudo python3 deploy/native/stack.py stop --user "$USER"
          test -s "$HOME/.local/share/forge-native/postgres/PG_VERSION"
          test -s "$HOME/.local/share/forge-native/validation-proof.json"
          if curl --fail --silent http://127.0.0.1:8081/readyz; then exit 1; fi
      - name: Restart and verify retained identity and product records
        shell: bash
        run: |
          sudo python3 deploy/native/stack.py up --user "$USER" --go "$(command -v go)"
          python3 deploy/native/smoke.py verify
      - name: Install verified kind and kubectl
        shell: bash
        run: sudo bash deploy/kubernetes/install-tools.sh
      - name: Copy native databases into Kubernetes and verify real login and ownership
        shell: bash
        run: |
          sudo python3 deploy/kubernetes/stack.py import-native --user "$USER"
          python3 deploy/native/smoke.py verify --state-dir "$HOME/.local/share/forge-kubernetes"
      - name: Kubernetes quickstart examples with real token
        shell: pwsh
        run: ./scripts/api-examples.ps1 -TokenFile "$HOME/.local/share/forge-kubernetes/tokens/ahmad.json"
      - name: Stop and restart Kubernetes with retained database and issuer
        shell: bash
        run: |
          sudo python3 deploy/kubernetes/stack.py stop --user "$USER"
          test -s "$HOME/.local/share/forge-native/postgres/PG_VERSION"
          if curl --fail --silent http://127.0.0.1:8081/readyz; then exit 1; fi
          sudo python3 deploy/kubernetes/stack.py up --user "$USER"
          python3 deploy/native/smoke.py verify --state-dir "$HOME/.local/share/forge-kubernetes"
      - name: Kubernetes teardown retains copied data
        if: always()
        shell: bash
        run: |
          if [ -f "$HOME/.local/share/forge-kubernetes/imported.json" ]; then
            sudo python3 deploy/kubernetes/stack.py stop --user "$USER"
          fi
      - name: Native teardown
        if: always()
        shell: bash
        run: |
          if [ -f "$HOME/.local/share/forge-native/installation.json" ]; then
            sudo python3 deploy/native/stack.py stop --user "$USER"
          fi
