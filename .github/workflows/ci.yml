name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test -timeout 60s ./...
      - run: go build ./...
      - name: Race detection
        if: runner.os == 'Linux'
        run: go test -race -timeout 60s ./...
      - name: Process signal smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go build -o /tmp/forge-api ./cmd/api
          if FORGE_HTTP_ADDR=0.0.0.0:8081 /tmp/forge-api; then
            echo 'Unsafe configuration was accepted'
            exit 1
          fi
          /tmp/forge-api > /tmp/forge-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8081/readyz
          kill -TERM "$pid"
          wait "$pid"
          grep -q 'API stopped' /tmp/forge-api.log
          trap - EXIT

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d3852670a11f0cb9cb1cd50916dc02a0021143fb22d96b78eeef26348abe55c
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: forge-ci-test-only
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FORGE_TEST_ADMIN_DATABASE_URL: postgres://postgres:forge-ci-test-only@127.0.0.1:5432/postgres?sslmode=disable
      FORGE_REQUIRE_DB_TESTS: '1'
      FORGE_RESTART_PROOF_FILE: /tmp/forge-restart-proof.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 -timeout 120s ./...
      - name: Seed restart proof
        env:
          FORGE_TEST_RESTART_PHASE: seed
        run: go test -count=1 -v -run '^TestPostgreSQLRestartPersistence$' ./internal/store
      - name: Restart PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify after database restart
        env:
          FORGE_TEST_RESTART_PHASE: verify
        run: go test -count=1 -v -run '^TestPostgreSQLRestartPersistence$' ./internal/store
