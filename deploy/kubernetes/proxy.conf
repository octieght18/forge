pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Streaming API reads enforce 64 KiB and return the published JSON error.
    client_max_body_size 0;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    # The only externally reachable Pod listener forwards to the local API.
    server {
        listen 8080;
        location = /proxy-ready { return 200; }
        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_request_buffering off;
        }
    }
    # OIDC discovery/JWKS retain the pinned public loopback origin inside this Pod.
    # No caller-selected destination, Forwarded header or general CONNECT proxy.
    server {
        listen 127.0.0.1:8082;
        location /realms/forge/ {
            proxy_pass http://keycloak:8082;
            proxy_set_header Host 127.0.0.1:8082;
            proxy_set_header Connection "";
        }
        location / { return 404; }
    }
}
