apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forge-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/octieght18/forge
    targetRevision: main
    path: deploy/gitops/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: forge-local
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
