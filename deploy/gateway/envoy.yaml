apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: forge-local
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: forge_http
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: forge
                    route_config:
                      name: local
                      virtual_hosts:
                        - name: forge
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/api/" }
                              route: { cluster: forge_api }
                            - match: { prefix: "/healthz" }
                              route: { cluster: forge_api }
                            - match: { prefix: "/readyz" }
                              route: { cluster: forge_api }
                    http_filters:
                      - name: envoy.filters.http.local_ratelimit
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                          stat_prefix: forge_rate
                          token_bucket:
                            max_tokens: 200
                            tokens_per_fill: 200
                            fill_interval: 1s
                          filter_enabled:
                            default_value: { numerator: 100, denominator: HUNDRED }
                          filter_enforced:
                            default_value: { numerator: 100, denominator: HUNDRED }
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: forge_api
          type: STRICT_DNS
          load_assignment:
            cluster_name: forge_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: api.forge-local.svc.cluster.local
                          port_value: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: forge-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.32.3
          args: ["-c", "/etc/envoy/envoy.yaml"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: forge-local
spec:
  type: ClusterIP
  selector:
    app: envoy
  ports:
    - port: 8080
      targetPort: 8080
